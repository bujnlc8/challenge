# Local recovery profile; credentials are provided by environment variables.
server.port=${SERVER_PORT:8180}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:33060}/${MYSQL_DATABASE:challenge}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
# The existing rank mapper groups complete rows by uid. Scope legacy compatibility to this pool.
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode = REPLACE(@@SESSION.sql_mode, 'ONLY_FULL_GROUP_BY', '')
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=10000ms
captcha.host=${captcha_host:http://127.0.0.1:8081/}
weixin.app_id=${weixin_app_id:}
weixin.app_secret=${weixin_app_secret:}
qq.app_id=${qq_app_id:}
qq.app_secret=${qq_app_secret:}
alipay.app_id=${alipay_app_id:}
alipay.rsa_public_key=${alipay_rsa_public_key:${alipay_public_key:}}
alipay.rsa_private_key=${alipay_rsa_private_key:${alipay_private_key:}}
qcloud.secrect_id=${qcloud_secrect_id:}
qcloud.secrect_key=${qcloud_secrect_key:}
